name: Homework diary check

on:
  schedule:
    # 12:00 UTC = 16:00 Asia/Yerevan (Armenia has no DST, so this offset is fixed year-round)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run homework check
        env:
          DIARY_LOGIN: ${{ secrets.DIARY_LOGIN }}
          DIARY_PASSWORD: ${{ secrets.DIARY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python homework_check.py

      - name: Upload debug screenshots (only created on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore
